<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ambig-SWE dashboard</title>
<style>
:root{
  --bg:#14140f; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2b2b2a;
  --line:#38383a; --line-soft:#2c2c2b;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8b8a80;
  --ask:#eda100;            /* asked -- used for nothing else */
  --ask-wash:rgba(237,161,0,.10);
  --good:#1baf7a;           /* resolved */
  --bad:#e66767;            /* unresolved */
  --interactive:#3987e5;    /* dataset: interactive-swe */
  --missing:#9085e9;        /* dataset: missing-info */
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --row:30px;
}
html[data-theme="light"]{
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0f0ed; --surface-3:#e5e5e1;
  --line:#d5d5d0; --line-soft:#e4e4e0;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#78776f;
  --ask:#a97400; --ask-wash:rgba(237,161,0,.14);
  --good:#0d7d55; --bad:#c0322f;
  --interactive:#2a78d6; --missing:#4a3aa7;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.5 var(--sans);
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--interactive)}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);
}
h1{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:11.5px}
.sub code{font-family:var(--mono)}
.spacer{flex:1}
.hbtn{
  padding:4px 10px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface-2);font-size:11.5px;color:var(--ink-2);
}
.hbtn:hover{background:var(--surface-3);color:var(--ink)}
.askpill{
  display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;
  background:var(--ask-wash);border:1px solid var(--ask);color:var(--ask);
  font-size:11.5px;font-weight:600;cursor:pointer;
}
.askpill:hover{filter:brightness(1.15)}
.warnbar{
  position:relative;padding:7px 34px 7px 14px;background:rgba(230,103,103,.12);
  border-bottom:1px solid var(--bad);color:var(--bad);font-size:11.5px;
}
.warnbar ul{margin:5px 0 0;padding-left:18px}
.warnbar-x{
  position:absolute;top:5px;right:8px;width:20px;height:20px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  background:none;border:0;border-radius:5px;
  color:var(--bad);font-size:15px;cursor:pointer;opacity:.65;
}
.warnbar-x:hover{opacity:1;background:rgba(230,103,103,.18)}
/* Affected rows: a click target per run, so the warning names what it covers. */
.warnbar-where{margin:4px 0 0;padding-left:18px;list-style:none}
.warnbar-where li{margin-top:2px}
.warnbar-loc{
  background:none;border:0;padding:0;cursor:pointer;text-align:left;
  color:var(--bad);font:inherit;font-family:var(--mono);font-size:10.5px;
  opacity:.85;text-decoration:underline dotted;
}
.warnbar-loc:hover{opacity:1}

/* ---------- overview ---------- */
#overview{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 14px;overflow-x:auto;
}
#overview[hidden]{display:none}
.arms{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.arm{
  flex:1 1 340px;min-width:320px;border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;background:var(--surface-2);
}
.arm h3{margin:0 0 1px;font-size:12.5px;font-family:var(--mono);font-weight:600}
.chan{color:var(--ink-3);font-size:11px;margin-bottom:9px}
.rates{display:flex;gap:22px;margin-bottom:9px}
.rate .lab{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.rate .val{font-size:23px;font-weight:660;line-height:1.15;font-variant-numeric:tabular-nums}
.rate .frac{font-size:12px;color:var(--ink-2);font-family:var(--mono)}
.rate .note{font-size:10.5px;color:var(--ink-3)}
.condrow{
  display:grid;grid-template-columns:110px 1fr 1fr;gap:9px;
  padding:3px 0;border-top:1px solid var(--line-soft);font-size:11.5px;
  align-items:center;
}
.condrow .cname{font-family:var(--mono);color:var(--ink-2)}
.miniwrap{display:flex;align-items:center;gap:6px}
.mini{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:36px}
.mini i{display:block;height:100%}
.num{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
.gap{
  margin-top:9px;padding:6px 9px;border-radius:6px;background:var(--surface-3);
  color:var(--ink-2);font-size:11px;
}
.notepool{margin-top:9px;color:var(--ink-3);font-size:11px}

/* ---------- filters ---------- */
#filters{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);
}
.fgroup{display:flex;align-items:center;gap:5px}
.flabel{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.chip{
  padding:2.5px 8px;border:1px solid var(--line);border-radius:99px;
  font-size:11px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap;
}
.chip:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip:disabled{opacity:.32;cursor:not-allowed}
.chip .c{opacity:.65;margin-left:4px;font-family:var(--mono);font-size:10px}
#count{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-left:auto}
#btn-reset{padding:3px 9px;font-size:11px}
#btn-reset:disabled{opacity:.35;cursor:default}

/* Family chip + its model dropdown. */
.famwrap{position:relative;display:inline-flex;gap:0}
.chip.fam{border-top-right-radius:0;border-bottom-right-radius:0}
.chip.caret{
  border-top-left-radius:0;border-bottom-left-radius:0;border-left:0;
  padding-left:5px;padding-right:6px;font-size:9px;
}
.fammenu{
  position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:210px;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:4px;display:flex;flex-direction:column;gap:1px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
.mrow{
  display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:5px;
  font-size:11px;font-family:var(--mono);color:var(--ink-2);text-align:left;width:100%;
}
.mrow:hover{background:var(--surface-2);color:var(--ink)}
.mrow[aria-pressed="true"]{color:var(--ink);font-weight:600}
.mrow .tick{width:9px;color:var(--good);flex:none}
.mrow .c{margin-left:auto;opacity:.6;font-size:10px}
.msep{height:1px;background:var(--line-soft);margin:3px 0}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
#list{
  width:44%;min-width:300px;max-width:72%;
  display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface);
  container:list / inline-size;
}
#drag{width:4px;cursor:col-resize;background:var(--line-soft);flex:none}
#drag:hover{background:var(--interactive)}
#detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- run table ---------- */
.thead,.trow{
  display:grid;
  /* The instance column floors at 0 so the grid always fits its pane: a
     min-content floor would push the right-hand columns out over the detail
     pane when the split is dragged left. Narrow widths drop columns instead
     (see the container queries below). */
  grid-template-columns:16px minmax(0,1.5fr) 74px 84px 78px 44px 42px 56px 22px;
  gap:7px;align-items:center;padding:0 9px;
  overflow:hidden;
}
.thead{
  height:26px;border-bottom:1px solid var(--line);
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  background:var(--surface);position:sticky;top:0;z-index:2;
}
.thead button{text-align:left;font:inherit;color:inherit;width:100%;letter-spacing:inherit}
.thead button:hover{color:var(--ink)}
.thead .sorted{color:var(--ink)}
/* Shed the least load-bearing columns as the pane narrows, so what remains
   stays readable instead of every column being squeezed. Order of sacrifice:
   evts, then tools, then time, then arm -- ask/eval/condition/instance are the
   study's outcome columns and are never dropped. */
@container list (max-width:660px){
  .thead,.trow{grid-template-columns:16px minmax(0,1.5fr) 74px 84px 78px 44px 56px 22px}
  .col-evts{display:none}
}
@container list (max-width:580px){
  .thead,.trow{grid-template-columns:16px minmax(0,1.5fr) 74px 84px 78px 56px 22px}
  .col-tools{display:none}
}
@container list (max-width:500px){
  .thead,.trow{grid-template-columns:16px minmax(0,1.5fr) 74px 84px 78px 22px}
  .col-time{display:none}
}
@container list (max-width:420px){
  .thead,.trow{grid-template-columns:16px minmax(0,1.5fr) 74px 78px 22px}
  .col-arm{display:none}
}
#rows{flex:1;overflow-y:auto;position:relative}
#spacer{position:relative;width:100%}
.trow{
  position:absolute;left:0;right:0;height:var(--row);
  border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:11.5px;
  border-left:2px solid transparent;
}
.trow:hover{background:var(--surface-2)}
.trow[data-asked="1"]{background:var(--ask-wash);border-left-color:var(--ask)}
.trow[aria-selected="true"]{background:var(--surface-3);border-left-color:var(--interactive)}
.trow[data-asked="1"][aria-selected="true"]{border-left-color:var(--ask)}
.inst{
  font-family:var(--mono);font-size:11px;white-space:nowrap;
  display:flex;min-width:0;
}
/* The prefix shrinks and ellipsises; the issue number never does. */
.inst .iprefix{overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink-2)}
.col-ask{display:flex;align-items:center}
.col-cond,.col-eval{min-width:0;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.yes{background:var(--ask)}
.dot.no{border:1.5px solid var(--ink-3)}
.dot.unk{border:1.5px dashed var(--ink-3)}
.badge{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;
  font-family:var(--mono);border:1px solid currentColor;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.badge.fill{color:var(--bg)}
.b-interactive{color:var(--interactive)}
.b-interactive.fill{background:var(--interactive);border-color:var(--interactive)}
.b-missing{color:var(--missing)}
.b-missing.fill{background:var(--missing);border-color:var(--missing)}
.ev{font-family:var(--mono);font-size:10.5px;white-space:nowrap}
.ev.ok{color:var(--good)} .ev.no{color:var(--bad)} .ev.un{color:var(--ink-3)}
.mut{
  color:var(--ink-3);font-family:var(--mono);font-size:10.5px;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pairbtn{color:var(--ink-3);font-size:12px;text-align:center}
.pairbtn:hover{color:var(--interactive)}
.empty{padding:28px 14px;text-align:center;color:var(--ink-3);font-size:12px}

/* ---------- detail ---------- */
#dhead{padding:11px 15px;border-bottom:1px solid var(--line);background:var(--surface)}
#dhead .r1{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
#dhead h2{margin:0;font-size:14px;font-family:var(--mono);font-weight:620}
#dhead .meta{color:var(--ink-3);font-size:11px;display:flex;gap:11px;flex-wrap:wrap}
#dhead .meta b{color:var(--ink-2);font-weight:500;font-family:var(--mono)}
.askribbon{
  margin-top:8px;padding:6px 11px;border-radius:6px;
  background:var(--ask-wash);border:1px solid var(--ask);color:var(--ask);
  font-size:11.5px;font-weight:600;
}
.tabs{display:flex;gap:3px;padding:0 15px;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs[hidden]{display:none}   /* display:flex would otherwise beat [hidden] */
.tab{
  padding:7px 13px;border-bottom:2px solid transparent;color:var(--ink-3);
  font-size:12px;margin-bottom:-1px;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--interactive);font-weight:600}
.tab .n{
  font-family:var(--mono);font-size:10px;opacity:.7;margin-left:5px;
  padding:0 4px;border-radius:3px;background:var(--surface-3);
}
#panel{flex:1;overflow-y:auto;padding:14px 15px;container-type:inline-size}
.hint{color:var(--ink-3);font-size:11.5px;margin:0 0 10px}
.placeholder{
  display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;
  height:100%;color:var(--ink-3);text-align:center;font-size:12.5px;
}
kbd{
  font-family:var(--mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--line);
  border-radius:4px;background:var(--surface-2);color:var(--ink-2);
}

/* ---------- timeline ---------- */
.tlbar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.ev-row{
  display:grid;grid-template-columns:34px 20px 84px minmax(0,1fr) auto;gap:9px;
  padding:4px 7px;border-radius:5px;cursor:pointer;align-items:baseline;
  border-left:2px solid transparent;
}
/* A `display` rule beats the [hidden] attribute's UA default, so any element
   given an explicit display must opt back out of hiding itself. */
.ev-row[hidden],.ev-body[hidden],.divider[hidden]{display:none}
.ev-row:hover{background:var(--surface-2)}
.ev-row[data-flag="ask"]{background:var(--ask-wash);border-left-color:var(--ask)}
.ev-row[data-flag="edit"]{border-left-color:var(--interactive)}
.ev-row[data-flag="error"]{border-left-color:var(--bad)}
.ev-i{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:right}
.ev-k{font-size:11px;text-align:center}
.ev-n{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.ev-t{
  font-size:11.5px;color:var(--ink-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);
}
.ev-row[data-flag="ask"] .ev-t{color:var(--ask);font-weight:600}
.ev-x{font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap}
.ev-x.err{color:var(--bad)}
.ev-body{padding:2px 7px 10px 43px}
.divider{
  display:flex;align-items:center;gap:9px;margin:9px 0;
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;
}
.divider::after{content:"";flex:1;height:1px;background:currentColor;opacity:.34}
.divider.ask{color:var(--ask)} .divider.edit{color:var(--interactive)}
pre.code{
  margin:5px 0;padding:8px 10px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:6px;font-family:var(--mono);font-size:11px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;overflow-x:auto;max-height:420px;
}
pre.code.out{background:var(--surface-2);color:var(--ink-2)}
.trunc{
  color:var(--ask);font-size:10.5px;font-family:var(--mono);
  padding:3px 0;display:block;
}
.flabel2{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}

/* ---------- messages ---------- */
.msg{margin-bottom:11px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line-soft)}
.msg.user{background:var(--surface-2);border-style:dashed}
.msg .who{
  font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;
}
.msg .txt{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6}
.qcard{border:1px solid var(--ask);border-radius:8px;padding:11px 13px;margin-bottom:11px;background:var(--ask-wash)}
.qcard h4{margin:0 0 7px;font-size:12.5px;color:var(--ask)}
.qq{margin:9px 0 5px;font-size:12px;font-weight:600}
.qopt{
  padding:5px 9px;margin:3px 0;border:1px solid var(--line);border-radius:6px;
  font-size:11.5px;background:var(--surface);
}
.qopt.chosen{border-color:var(--good);background:rgba(27,175,122,.12)}
.qopt .ol{font-weight:600}
.qopt .od{color:var(--ink-3);font-size:11px;margin-top:2px}
.answer{margin-top:7px;font-size:11.5px;color:var(--good);font-family:var(--mono)}

/* ---------- prompt ---------- */
/* Single line, always: the detail lives in the title tooltip. */
.verified,.unverified{
  display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:6px;
  font-size:11px;margin-bottom:10px;white-space:nowrap;overflow:hidden;cursor:help;
}
.verified span,.unverified span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.verified code,.unverified code{margin-left:auto;flex:none}
.verified{background:rgba(27,175,122,.11);border:1px solid var(--good);color:var(--good)}
.unverified{background:rgba(230,103,103,.11);border:1px solid var(--bad);color:var(--bad)}
.verified code,.unverified code{font-family:var(--mono);font-size:10.5px;opacity:.85}
.prompt{
  white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;
  line-height:1.65;padding:13px 15px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:8px;
}
/* The hash certifies one text; every other view says so rather than borrowing
   the green tick. */
.verified.dim{opacity:.6;background:none;border-style:dashed}

/* Full issue beside the rewrite. Stacks under a narrow detail pane. */
.side{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@container (max-width:760px){.side{grid-template-columns:1fr}}
.side .prompt{max-height:none}
.qa-compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@container (max-width:760px){.qa-compare{grid-template-columns:minmax(0,1fr)}}
mark{background:rgba(230,103,103,.28);color:inherit;border-radius:2px;padding:0 1px}

/* Category ledger: all six always, so "hidden" reads against a baseline. */
.ledger{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0;align-items:center}
.ledlab{
  font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  margin-right:2px;
}
.catchip{
  padding:2px 9px;border-radius:99px;font-size:11px;font-family:var(--mono);
  border:1px solid currentColor;white-space:nowrap;
}
.catchip.hidden{background:var(--bad);border-color:var(--bad);color:var(--bg);font-weight:600}
.catchip.present{color:var(--ink-2)}
.catchip.absent{color:var(--ink-3);opacity:.4;border-style:dashed}
.catchip b{color:inherit}
/* Legend sits on the ledger's own row, pushed right; wraps under it when the
   pane is narrow rather than squeezing the chips. */
.legend{
  margin-left:auto;display:flex;gap:11px;align-items:center;
  font-size:10px;color:var(--ink-3);white-space:nowrap;
}
.legend span{display:flex;gap:4px;align-items:center;cursor:help}
.legend .sw{width:8px;height:8px;border-radius:2px;border:1px solid var(--ink-3);display:inline-block}
.legend .sw.hidden{background:var(--bad);border-color:var(--bad)}
.legend .sw.present{background:none;border-color:var(--ink-2)}
.legend .sw.absent{background:none;border-style:dashed;opacity:.5}

/* ---------- patch + eval ---------- */
/* minmax(0,1fr) lets the diff column shrink instead of pushing the eval
   sidebar off the edge -- a grid track defaults to min-content, and a wide
   diff line would otherwise overflow the pane. */
.two{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
@container (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--surface);margin-bottom:11px}
.card h4{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.card.ask{border-color:var(--ask);background:var(--ask-wash)}
.card.ask h4{color:var(--ask)}
.verdict{font-size:17px;font-weight:660;margin-bottom:9px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)} .verdict.un{color:var(--ink-3)}
.kv{display:flex;justify-content:space-between;gap:9px;padding:3px 0;font-size:11.5px;border-top:1px solid var(--line-soft)}
.kv .k{color:var(--ink-3)} .kv .v{font-family:var(--mono);color:var(--ink-2);text-align:right}
.filerow{
  display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px;
  font-family:var(--mono);border-top:1px solid var(--line-soft);
}
.filerow .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{padding:0 5px;border-radius:3px;font-size:9.5px;border:1px solid currentColor}
.tag.gold{color:var(--good)} .tag.test{color:var(--ink-3)}
.plus{color:var(--good)} .minus{color:var(--bad)}
.diff{font-family:var(--mono);font-size:11px;line-height:1.5;overflow-x:auto;max-height:640px;overflow-y:auto;
  border:1px solid var(--line-soft);border-radius:7px;background:var(--surface)}
.diff div{padding:0 9px;white-space:pre}
.diff .a{background:rgba(27,175,122,.13)}
.diff .d{background:rgba(230,103,103,.13)}
.diff .h{background:var(--surface-3);color:var(--ink-3)}
.diff .f{background:var(--surface-2);color:var(--ink);font-weight:600;border-top:1px solid var(--line)}
.tests{max-height:230px;overflow-y:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.tests div{padding:1px 0;word-break:break-all}
.tests .fail{color:var(--bad)}

/* ---------- coverage ---------- */
.card h4 .covmodel{
  font-family:var(--mono);text-transform:none;letter-spacing:0;font-size:10.5px;
  color:var(--ink-2);margin-left:8px;font-weight:400;
}
.cov-switch{margin-left:auto}
.cov-switch .chip.caret{border-radius:5px;border-left:1px solid var(--line);padding:2px 7px;font-size:10px}
.cov-switch .fammenu{left:auto;right:0}
.card h4:has(.cov-switch){display:flex;align-items:center;gap:4px}
.covtab{border-collapse:collapse;font-size:11px}
.covtab th{
  font-weight:500;color:var(--ink-3);text-align:left;padding:2px 7px;
  font-family:var(--mono);font-size:10.5px;white-space:nowrap;
}
.covtab tbody th{width:1%}
.covtab thead th{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;text-align:center}
.cov{
  text-align:center;padding:2px 7px;font-family:var(--mono);font-size:11px;
  border:1px solid var(--line-soft);cursor:pointer;width:74px;
}
.cov.none{color:var(--ink-3);opacity:.45;cursor:default}
.cov.ok{color:var(--good);background:rgba(27,175,122,.10)}
.cov.no{color:var(--bad);background:rgba(230,103,103,.10)}
.cov.asked{background:var(--ask-wash);color:var(--ask);font-weight:700}
.cov:hover:not(.none){outline:1px solid var(--interactive)}

/* ---------- misc ---------- */
details{margin:7px 0}
summary{cursor:pointer;font-size:11.5px;color:var(--ink-3)}
summary:hover{color:var(--ink-2)}
.quarantine{border:1px dashed var(--ask);border-radius:7px;padding:9px 11px;background:var(--ask-wash);margin-top:11px}
@media print{
  body{overflow:visible;height:auto}
  #filters,#list,#drag,.tabs,header .hbtn,.askpill{display:none!important}
  main,#detail,#panel{display:block;overflow:visible;height:auto}
}
</style>
</head>
<body>

<header>
  <h1>ambig-SWE</h1>
  <span class="sub" id="hsub"></span>
  <button class="askpill" id="askpill" hidden></button>
  <span class="spacer"></span>
  <button class="hbtn" id="btn-overview" aria-pressed="true" title="show or hide the summary (o)">▾ summary</button>
  <button class="hbtn" id="btn-theme">theme</button>
</header>

<div class="warnbar" id="warnbar" hidden></div>
<div id="filters"></div>
<section id="overview"></section>

<main>
  <div id="list">
    <div class="thead" id="thead"></div>
    <div id="rows"><div id="spacer"></div></div>
  </div>
  <div id="drag"></div>
  <div id="detail">
    <div id="dhead"></div>
    <div class="tabs" id="tabs" hidden></div>
    <div id="panel"></div>
  </div>
</main>


<script id="DATA" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
/* The payload is inlined as raw text, so `</` was escaped to `<\/` at build
   time to stop the HTML parser closing the tag early. Inside an
   application/json block that backslash is literal, not a JS escape, so it has
   to be undone before parsing. */
const DATA = JSON.parse(
  document.getElementById("DATA").textContent
    .replace(/<\\\//g, "</").replace(/<\\!--/g, "<!--")
);
const RUNS = DATA.runs, PAIRS = DATA.pairs, META = DATA.meta;
const byId = new Map(RUNS.map(r => [r.run_id, r]));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pct = (n, d) => d ? (100 * n / d).toFixed(1) + "%" : "—";
function dur(s){
  if (s == null) return "—";
  const m = Math.floor(s / 60);
  return m ? `${m}m ${Math.round(s % 60)}s` : `${Math.round(s)}s`;
}
/* With n this small a percentage alone invites overclaiming, so a rate is only
   shown as a percentage once the denominator can support one. */
const SMALL_N = 10;
/* A percentage is only meaningful with enough events behind it. Below five
   occurrences the fraction leads and the percentage is demoted to a caption,
   so "1/31" never gets read as a solid 3.2%. */
const SMALL_K = 5;
function rate(n, d){
  if (!d) return "—";
  if (d < SMALL_N || n < SMALL_K) return `${n}/${d}`;
  return pct(n, d);
}
function rateNote(n, d){
  if (!d) return "no runs";
  if (d < SMALL_N) return `n=${d}, too few for a rate`;
  if (n < SMALL_K) return `${pct(n, d)} — ${n} event${n === 1 ? "" : "s"}, treat as provisional`;
  return "";
}

const dsClass = d => d === "missing-info" ? "b-missing" : "b-interactive";
const isFull  = c => String(c).endsWith("full");

function condBadge(run){
  const cls = dsClass(run.dataset) + (isFull(run.condition) ? "" : " fill");
  return `<span class="badge ${cls}" title="${esc(run.dataset)} · ${esc(run.condition)}">${esc(run.condition)}</span>`;
}
function askDot(run){
  const a = run.ask.direct_asked;
  const cls = a === true ? "yes" : (a === false ? "no" : "unk");
  const t = a === true ? "asked" : (a === false ? "did not ask" : "unobservable");
  return `<span class="dot ${cls}" title="${t}"></span>`;
}
function evalCell(run){
  const e = run.eval;
  if (e.status !== "scored") return `<span class="ev un">– unscored</span>`;
  return e.resolved
    ? `<span class="ev ok" title="F2P ${e.f2p_passed}/${e.f2p_total}">✓ resolved</span>`
    : `<span class="ev no" title="F2P ${e.f2p_passed}/${e.f2p_total}">✗ failed</span>`;
}
const runnerGlyph = r => r.startsWith("codex") ? "▣" : "◆";
/* Split "astropy__astropy-13236" into its repo prefix and the issue number.
   Instance ids differ only in the trailing number, so when the column is
   narrow the prefix is what must give way -- truncating left-to-right would
   hide the only part that identifies the task. */
function instParts(run){
  const id = run.instance_id || "";
  const cut = id.lastIndexOf("-");
  return cut > 0 ? [id.slice(0, cut + 1), id.slice(cut + 1)] : ["", id];
}

/* ---------- state ---------- */
/* `resolved` is deliberately not a facet: it is the secondary outcome and is
   already a sortable column, and filtering by it invites reading ask-rate off
   a set selected on its result. */
const FACETS = ["dataset","family","condition","asked","repo","difficulty"];
const state = {
  filters: Object.fromEntries(FACETS.map(f => [f, new Set()])),
  search: "", sort: "asked", dir: -1,
  selected: null, panel: "timeline", overview: true, promptView: null,
  models: {},          // family -> Set of pinned models (empty/absent = all)
  openFamily: null,    // family whose model dropdown is expanded
  coverageFamily: {},  // family -> model shown in the coverage card
};

function facetValue(run, facet){
  switch(facet){
    case "dataset": return run.dataset;
    case "family": return run.runner;   // claude-sdk | codex-cli
    case "condition": return run.condition;
    case "asked": return run.ask.direct_asked === true ? "yes"
                       : run.ask.direct_asked === false ? "no" : "unobservable";
    case "repo": return run.repo;
    case "difficulty": return run.difficulty;
  }
}

/* Models grouped by the runner that hosts them. One family may hold several
   models over time; selecting the family means "all of its models" unless
   individual models are picked from its dropdown. */
function familyModels(family){
  return [...new Set(RUNS.filter(r => r.runner === family).map(r => r.model))].sort();
}
/* A run passes the model filter when its family is selected AND either no
   model within that family is pinned, or its own model is one of the pinned. */
function passesModel(run){
  const pinned = state.models[run.runner];
  return !pinned || !pinned.size || pinned.has(run.model);
}
/* Standard faceted semantics: OR within a group, AND across groups. A group
   with nothing selected constrains nothing. */
function matches(run, skip){
  for (const f of FACETS){
    if (f === skip) continue;
    const sel = state.filters[f];
    if (sel.size && !sel.has(facetValue(run, f))) return false;
  }
  if (skip !== "family" && !passesModel(run)) return false;
  if (state.search && !run._search.includes(state.search)) return false;
  return true;
}
const SORTS = {
  asked:    r => (r.ask.direct_asked === true ? 2 : r.ask.direct_asked === false ? 1 : 0),
  instance: r => r.instance_id || "",
  condition:r => r.condition || "",
  arm:      r => r.arm || "",
  eval:     r => (r.eval.status !== "scored" ? 0 : r.eval.resolved ? 2 : 1),
  tools:    r => r.counts.tools,
  events:   r => r.counts.events,
  time:     r => r.duration_seconds || 0,
};
function visible(){
  const out = RUNS.filter(r => matches(r, null));
  const key = SORTS[state.sort] || SORTS.asked;
  out.sort((a, b) => {
    const x = key(a), y = key(b);
    if (x < y) return -state.dir;
    if (x > y) return state.dir;
    return (a.started_at || "").localeCompare(b.started_at || "");
  });
  return out;
}

/* ---------- overview ---------- */
function cell(runs){
  const valid = runs.filter(r => r.ask.valid);
  const asked = valid.filter(r => r.ask.direct_asked === true);
  const scored = runs.filter(r => r.eval.valid);
  const resolved = scored.filter(r => r.eval.resolved);
  return { runs, valid, asked, scored, resolved,
           unobs: runs.length - valid.length };
}
function renderOverview(){
  const ov = $("#overview");
  ov.hidden = !state.overview;
  if (!state.overview) return;
  const shown = visible();
  const filtered = shown.length !== RUNS.length;
  /* Everything below is computed from the filtered set, so the summary always
     describes exactly the runs listed underneath it -- including which arms and
     conditions are on screen at all. */
  const arms = [...new Set(shown.map(r => r.arm))].sort();

  const cards = arms.map(arm => {
    const runs = shown.filter(r => r.arm === arm);
    const c = cell(runs);
    const chan = runs[0]?.ask_channel || "—";
    const conds = [...new Set(runs.map(r => r.condition))].sort();
    const rows = conds.map(cond => {
      const cc = cell(runs.filter(r => r.condition === cond));
      if (!cc.runs.length) return "";
      return `<div class="condrow">
        <span class="cname">${esc(cond)}</span>
        <span class="miniwrap"><span class="mini"><i style="width:${cc.valid.length?100*cc.asked.length/cc.valid.length:0}%;background:var(--ask)"></i></span>
          <span class="num">${cc.asked.length}/${cc.valid.length} ask</span></span>
        <span class="miniwrap"><span class="mini"><i style="width:${cc.scored.length?100*cc.resolved.length/cc.scored.length:0}%;background:var(--good)"></i></span>
          <span class="num">${cc.resolved.length}/${cc.scored.length} res</span></span>
      </div>`;
    }).join("");
    return `<div class="arm">
      <h3>${runnerGlyph(arm.split("::")[0])} ${esc(arm.replace("::", " / "))}</h3>
      <div class="chan">ask channel: ${esc(chan)}</div>
      <div class="rates">
        <div class="rate"><div class="lab">asked</div>
          <div class="val" style="color:var(--ask)">${rate(c.asked.length, c.valid.length)}</div>
          <div class="frac">of ${c.valid.length} valid run(s)</div>
          ${rateNote(c.asked.length, c.valid.length) ? `<div class="note">${rateNote(c.asked.length, c.valid.length)}</div>` : ""}
          ${c.unobs ? `<div class="note">${c.unobs} unobservable, excluded</div>` : ""}</div>
        <div class="rate"><div class="lab">resolved</div>
          <div class="val" style="color:var(--good)">${rate(c.resolved.length, c.scored.length)}</div>
          <div class="frac">of ${c.scored.length} scored</div>
          ${rateNote(c.resolved.length, c.scored.length) ? `<div class="note">${rateNote(c.resolved.length, c.scored.length)}</div>` : ""}</div>
      </div>${rows}</div>`;
  }).join("");

  /* The control gap is a fact about the whole study, not about the current
     filter, so it is judged against RUNS and only shown when nothing is
     filtered away -- otherwise a filter would masquerade as missing data. */
  const missing = RUNS.filter(r => r.dataset === "missing-info");
  const noControl = missing.length && !missing.some(r => isFull(r.condition));
  ov.innerHTML = `<div class="arms">${cards || `<div class="gap">No runs match these filters.</div>`}</div>
    ${filtered ? `<div class="gap">Filtered: showing ${shown.length} of ${RUNS.length} runs — every figure above describes just these.</div>` : ""}
    ${noControl && !filtered ? `<div class="gap">missing-info: ambiguous only — the <code>mi_full</code> control has not been run, so no within-dataset comparison exists yet.</div>` : ""}
    <div class="notepool">Arms are never pooled: the ask channels differ by construction (tool call vs. final-message question).
      Ask rate excludes runs where asking was unobservable; resolve rate counts only scored runs.
      Rates with n&lt;${SMALL_N} are shown as fractions.</div>`;
}

/* ---------- filters ---------- */
function renderFilters(){
  const groups = FACETS.map(facet => {
    const vals = [...new Set(RUNS.map(r => facetValue(r, facet)).filter(v => v != null))].sort();
    if (vals.length < 2 && facet !== "asked") return "";
    const chips = vals.map(v => {
      /* Count against the OTHER groups, so a 0 warns before you click it. */
      const n = RUNS.filter(r => matches(r, facet) && facetValue(r, facet) === v).length;
      const on = state.filters[facet].has(v);
      /* The family chip carries its models in a dropdown: selecting the family
         means every model under it, and the caret opens the list to narrow. */
      if (facet === "family"){
        const models = familyModels(v);
        const pinned = state.models[v];
        const some = pinned && pinned.size && pinned.size < models.length;
        return `<span class="famwrap">
          <button class="chip fam" data-facet="family" data-val="${esc(v)}" aria-pressed="${on}"
            ${n === 0 && !on ? "disabled" : ""} title="${n} run(s) — ${models.length} model(s)">
            ${runnerGlyph(v)} ${esc(v)}<span class="c">${n}</span></button>
          ${models.length ? `<button class="chip caret" data-fam-open="${esc(v)}"
            aria-pressed="${state.openFamily === v}"
            title="choose models in this family">${some ? "◆" : "▾"}</button>` : ""}
          ${state.openFamily === v ? familyMenu(v, models) : ""}
        </span>`;
      }
      return `<button class="chip" data-facet="${esc(facet)}" data-val="${esc(v)}"
        aria-pressed="${on}" ${n === 0 && !on ? "disabled" : ""}
        title="${n} run(s)">${esc(v)}<span class="c">${n}</span></button>`;
    }).join("");
    const label = facet === "family" ? "model" : facet;
    return `<div class="fgroup"><span class="flabel">${esc(label)}</span>${chips}</div>`;
  }).join("");

  const shown = visible().length;
  const dirty = FACETS.some(f => state.filters[f].size) ||
    Object.values(state.models).some(s => s && s.size) || state.search;
  $("#filters").innerHTML = groups +
    `<span id="count">${shown === RUNS.length ? `${RUNS.length} runs` : `${shown} / ${RUNS.length} runs`}</span>
     <button class="hbtn" id="btn-reset" ${dirty ? "" : "disabled"}
       title="clear every filter">reset filters</button>`;
}

/* One model per row, plus an "all" row that clears the pins. Kept as a popover
   rather than inline chips so a family with a dozen models does not push the
   rest of the bar off screen. */
function familyMenu(family, models){
  const pinned = state.models[family] || new Set();
  const all = !pinned.size;
  const rows = models.map(m => {
    const n = RUNS.filter(r => r.model === m).length;
    return `<button class="mrow" data-fam="${esc(family)}" data-model="${esc(m)}"
      aria-pressed="${pinned.has(m)}">
      <span class="tick">${pinned.has(m) ? "✓" : ""}</span>${esc(m)}<span class="c">${n}</span></button>`;
  }).join("");
  return `<span class="fammenu">
    <button class="mrow" data-fam="${esc(family)}" data-model="" aria-pressed="${all}">
      <span class="tick">${all ? "✓" : ""}</span>all ${models.length} model${models.length === 1 ? "" : "s"}
      <span class="c">${RUNS.filter(r => r.runner === family).length}</span></button>
    <span class="msep"></span>${rows}</span>`;
}

/* ---------- run table (virtualised) ---------- */
/* [label, sort key, class] -- the class lets a container query hide the whole
   column (header cell and every row cell) as one unit. */
const COLS = [
  ["", null, "col-ask"], ["instance", "instance", "col-inst"], ["cond", "condition", "col-cond"],
  ["arm", "arm", "col-arm"], ["eval", "eval", "col-eval"], ["tools", "tools", "col-tools"],
  ["evts", "events", "col-evts"], ["time", "time", "col-time"], ["", null, "col-pair"],
];
function renderHead(){
  $("#thead").innerHTML = COLS.map(([label, key, cls]) => key
    ? `<button class="${cls}${state.sort === key ? " sorted" : ""}" data-sort="${key}">${label}${state.sort === key ? (state.dir > 0 ? " ▲" : " ▼") : ""}</button>`
    : `<span class="${cls}">${label}</span>`).join("");
}
let rowsCache = [];
function renderRows(){
  rowsCache = visible();
  const box = $("#rows"), spacer = $("#spacer");
  const H = 30;
  spacer.style.height = (rowsCache.length * H) + "px";
  if (!rowsCache.length){
    box.querySelectorAll(".trow").forEach(n => n.remove());
    if (!box.querySelector(".empty"))
      box.insertAdjacentHTML("beforeend", `<div class="empty">No runs match these filters.<br>Try clearing a facet.</div>`);
    return;
  }
  box.querySelector(".empty")?.remove();
  const top = box.scrollTop, height = box.clientHeight || 600;
  const first = Math.max(0, Math.floor(top / H) - 8);
  const last = Math.min(rowsCache.length, Math.ceil((top + height) / H) + 8);
  const frag = [];
  for (let i = first; i < last; i++){
    const r = rowsCache[i];
    const pair = pairPartner(r);
    frag.push(`<div class="trow" style="top:${i * H}px" data-id="${r.run_id}"
      data-asked="${r.ask.direct_asked === true ? 1 : 0}"
      aria-selected="${state.selected === r.run_id}">
      <span class="col-ask">${askDot(r)}</span>
      <span class="inst col-inst" title="${esc(r.instance_id)}"><span class="iprefix">${esc(instParts(r)[0])}</span>${esc(instParts(r)[1])}</span>
      <span class="col-cond">${condBadge(r)}</span>
      <span class="mut col-arm" style="text-align:left" title="${esc(r.arm)}">${runnerGlyph(r.runner)} ${esc(r.model.replace(/^claude-|^gpt-/, ""))}</span>
      <span class="col-eval">${evalCell(r)}</span>
      <span class="mut col-tools">${r.counts.tools}</span>
      <span class="mut col-evts">${r.counts.events}</span>
      <span class="mut col-time">${dur(r.duration_seconds)}</span>
      ${pair ? `<button class="pairbtn col-pair" data-pair="${pair.run_id}" title="paired ${esc(pair.condition)} run">↔</button>` : `<span class="col-pair"></span>`}
    </div>`);
  }
  box.querySelectorAll(".trow").forEach(n => n.remove());
  spacer.insertAdjacentHTML("afterend", frag.join(""));
}
function pairPartner(run){
  const p = PAIRS.find(p => p.ambiguous_run === run.run_id || p.full_run === run.run_id);
  if (!p || !p.complete) return null;
  const other = p.ambiguous_run === run.run_id ? p.full_run : p.ambiguous_run;
  return byId.get(other) || null;
}

/* ---------- detail ---------- */
function renderDetail(){
  const run = state.selected && byId.get(state.selected);
  if (!run){
    $("#dhead").innerHTML = "";
    $("#tabs").hidden = true;
    $("#panel").innerHTML = coverageView();
    return;
  }
  const e = run.eval, asked = run.ask.direct_asked === true;
  $("#dhead").innerHTML = `
    <div class="r1">
      <h2>${esc(run.instance_id)}</h2>${condBadge(run)}
      <span class="badge" style="color:var(--ink-3)">${runnerGlyph(run.runner)} ${esc(run.model)}</span>
      ${evalCell(run)}
    </div>
    <div class="meta">
      <span>run <b>${esc(run.short_id)}</b></span>
      <span>dataset <b>${esc(run.dataset)}</b></span>
      <span>${esc(run.repo || "")}</span>
      <span>${esc(run.difficulty || "")}</span>
      <span>${dur(run.duration_seconds)}</span>
      ${run.process.cost_usd != null ? `<span>$${run.process.cost_usd.toFixed(2)}</span>` : ""}
      <span>stop <b>${esc(run.process.stop_reason || "?")}</b></span>
    </div>
    ${asked ? `<div class="askribbon">⚠ This run asked a clarifying question before finishing — the study's primary outcome.</div>` : ""}
    ${run.dataset === "missing-info"
      ? viewLedger((DATA.keys || {})[run.instance_id] || {},
                   "", "what the rewrite withheld:")
      : ""}`;

  const tabs = [
    ["timeline", "Timeline", run.counts.events],
    ["messages", "Messages", run.counts.messages + (asked ? 1 : 0)],
    ["prompt", "Prompt", run.prompt.verified ? "✓" : "!"],
    ["patch", "Patch & Eval", run.patch.files.length],
  ];
  $("#tabs").hidden = false;
  $("#tabs").innerHTML = tabs.map(([id, label, n]) =>
    `<button class="tab" data-panel="${id}" aria-selected="${state.panel === id}">${label}<span class="n">${n}</span></button>`).join("");
  $("#panel").innerHTML = ({
    timeline: panelTimeline, messages: panelMessages,
    prompt: panelPrompt, patch: panelPatch,
  }[state.panel] || panelTimeline)(run);
  $("#panel").scrollTop = 0;
}

/* The landing view. With 14 of 500 instances run, "what still needs running?"
   is the most useful question an idle dashboard can answer, so an empty
   selection shows coverage rather than a blank pane. */
/* Grouped by model family, one card each, with a switcher in the card's corner
   when the family holds more than one model. Families are the stable unit; the
   model inside one changes as the study adds arms. */
function coverageView(){
  const families = [...new Set(RUNS.map(r => r.runner))].sort();
  const instances = [...new Set(RUNS.map(r => r.instance_id))].sort();
  const conds = [...new Set(RUNS.map(r => r.condition))].sort();
  const cells = new Map();
  for (const r of RUNS) cells.set(`${r.instance_id}|${r.model}|${r.condition}`, r);

  const tables = families.map(family => {
    const models = familyModels(family);
    const model = state.coverageFamily[family] && models.includes(state.coverageFamily[family])
      ? state.coverageFamily[family] : models[0];
    if (!model) return "";

    const rows = instances.map(inst => {
      const tds = conds.map(cond => {
        const run = cells.get(`${inst}|${model}|${cond}`);
        if (!run) return `<td class="cov none" title="not run">·</td>`;
        const asked = run.ask.direct_asked === true;
        const ok = run.eval.resolved;
        return `<td class="cov ${ok ? "ok" : "no"}${asked ? " asked" : ""}"
          data-go="${run.run_id}" title="${esc(run.instance_id)} · ${esc(cond)} · ${ok ? "resolved" : "unresolved"}${asked ? " · ASKED" : ""}">${asked ? "?" : (ok ? "✓" : "✗")}</td>`;
      }).join("");
      if (!conds.some(c => cells.has(`${inst}|${model}|${c}`))) return "";
      return `<tr><th>${esc(inst)}</th>${tds}</tr>`;
    }).filter(Boolean).join("");
    if (!rows) return "";

    const done = RUNS.filter(r => r.model === model).length;
    const switcher = models.length > 1
      ? `<span class="famwrap cov-switch">
          <button class="chip caret" data-cov-open="${esc(family)}"
            aria-pressed="${state.openFamily === "cov:" + family}">switch model ▾</button>
          ${state.openFamily === "cov:" + family ? `<span class="fammenu">${models.map(m =>
            `<button class="mrow" data-cov-pick="${esc(family)}" data-model="${esc(m)}"
               aria-pressed="${m === model}"><span class="tick">${m === model ? "✓" : ""}</span>${esc(m)}
               <span class="c">${RUNS.filter(r => r.model === m).length}</span></button>`).join("")}</span>` : ""}
        </span>`
      : "";
    return `<div class="card">
      <h4>${runnerGlyph(family)} ${esc(family)}
        <span class="covmodel">${esc(model)} · ${done} run(s)</span>${switcher}</h4>
      <table class="covtab"><thead><tr><th></th>${conds.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }).join("");

  const done = new Set(RUNS.map(r => r.instance_id)).size;
  return `<p class="hint">Coverage — ${done} instance(s) run so far, by model family.
    Click any cell to open that run. <span style="color:var(--ask)">?</span> = asked,
    ✓ = resolved, ✗ = unresolved, · = not run.</p>${tables}`;
}

const KGLYPH = { tool:"⚙", edit:"✎", msg:"💬", ask:"❓", search:"🔎", think:"…" };
function panelTimeline(run){
  if (!run.trace.length) return `<p class="hint">No session events were preserved for this run.</p>`;
  const codex = run.runner.startsWith("codex");
  const firstEdit = run.trace.find(e => e.k === "edit");
  const firstAsk = run.trace.find(e => e.k === "ask");
  const out = [`<p class="hint">${run.trace.length} events ·
    ${codex ? "ordinal order only — Codex events carry no timestamps"
            : "ordered by timestamp"}${
    firstAsk && firstEdit ? ` · asked at #${firstAsk.i}, first edit at #${firstEdit.i}` : ""}</p>`];
  /* Only offer a chip for a kind this run actually has -- a chip that always
     yields nothing reads as a broken control. */
  const present = run.trace.reduce((a, e) => (a[e.k] = (a[e.k] || 0) + 1, a), {});
  const kinds = ["tool","edit","msg","ask","search","think"].filter(k => present[k]);
  out.push(`<div class="tlbar">
    <button class="chip" data-tl="all" aria-pressed="true">all <span class="c">${run.trace.length}</span></button>
    ${kinds.map(k => `<button class="chip" data-tl="${k}" aria-pressed="false">${k} <span class="c">${present[k]}</span></button>`).join("")}
  </div><div class="hint" id="tlempty" hidden>No events of that kind in this run.</div>`);
  out.push(`<div id="tl">`);
  for (const ev of run.trace){
    if (firstAsk && ev.i === firstAsk.i) out.push(`<div class="divider ask" data-for="ask">first ask</div>`);
    if (firstEdit && ev.i === firstEdit.i) out.push(`<div class="divider edit" data-for="edit">first edit</div>`);
    const x = ev.meta?.exit_code;
    out.push(`<div class="ev-row" data-ev="${ev.i}" data-k="${ev.k}" data-flag="${ev.flag || ""}">
      <span class="ev-i">${ev.i}</span>
      <span class="ev-k">${KGLYPH[ev.k] || "•"}</span>
      <span class="ev-n">${esc(ev.name || ev.k)}</span>
      <span class="ev-t">${esc(ev.title || "")}</span>
      <span class="ev-x ${ev.ok === false ? "err" : ""}">${
        ev.ok === false ? "error" : (x != null ? "exit " + x : (ev.dt != null ? dur(ev.dt) : ""))}</span>
    </div><div class="ev-body" data-body="${ev.i}" hidden></div>`);
  }
  out.push(`</div>`);
  return out.join("");
}
function eventBody(run, i){
  const ev = run.trace.find(e => e.i === i);
  if (!ev) return "";
  const parts = [];
  if (ev.k === "ask" && ev.meta?.questions) parts.push(questionCards(ev.meta.questions, run.ask.questions));
  if (ev.body) parts.push(`<div class="flabel2">input</div><pre class="code">${esc(ev.body)}</pre>`);
  if (ev.trunc?.body) parts.push(`<span class="trunc">+${ev.trunc.body.toLocaleString()} bytes truncated — full text in ${esc(run.artifacts.sessions?.path || "sessions/")}</span>`);
  if (ev.out) parts.push(`<div class="flabel2">output</div><pre class="code out">${esc(ev.out)}</pre>`);
  if (ev.trunc?.out) parts.push(`<span class="trunc">+${ev.trunc.out.toLocaleString()} bytes truncated — full text in ${esc(run.artifacts.sessions?.path || "sessions/")}</span>`);
  if (ev.meta?.paths?.length) parts.push(`<div class="flabel2">files</div><pre class="code">${esc(ev.meta.paths.join("\n"))}</pre>`);
  return parts.join("") || `<p class="hint">No payload recorded.</p>`;
}
function questionCards(questions, answered){
  const picks = {};
  for (const round of (answered || [])) Object.assign(picks, round.answers || {});
  return (questions || []).map(q => `<div class="qcard">
    <h4>${esc(q.header || "Question")}</h4>
    <div class="qq">${esc(q.question)}</div>
    ${(q.options || []).map(o => {
      const chosen = picks[q.question] === o.label;
      return `<div class="qopt ${chosen ? "chosen" : ""}">
        <div class="ol">${esc(o.label)}${chosen ? " ✓" : ""}</div>
        ${o.description ? `<div class="od">${esc(o.description)}</div>` : ""}</div>`;
    }).join("")}
    ${picks[q.question] ? `<div class="answer">answered: ${esc(picks[q.question])}</div>` : ""}
  </div>`).join("");
}
function panelMessages(run){
  const msgs = run.trace.filter(e => e.k === "msg" || e.k === "ask");
  if (!msgs.length) return `<p class="hint">No agent messages were preserved for this run.</p>`;
  return `<p class="hint">${msgs.length} message(s), in order.</p>` + msgs.map(ev => {
    if (ev.k === "ask")
      return `<div class="msg" style="border-color:var(--ask)">
        <div class="who" style="color:var(--ask)">clarifying question</div>
        ${questionCards(ev.meta?.questions, run.ask.questions)}</div>`;
    const who = ev.meta?.role === "user" ? "user / injected" : "agent";
    return `<div class="msg ${ev.meta?.role === "user" ? "user" : ""}">
      <div class="who">${esc(who)}${ev.meta?.subagent ? " · subagent" : ""}</div>
      <div class="txt">${esc(ev.body || ev.title || "")}</div></div>`;
  }).join("");
}
/* The six information categories the workbook annotates, in fixed order so
   the ledger reads the same on every instance. */
const CATEGORIES = ["Error Information", "Reproduction Steps", "Expected Behavior",
  "Version/Environment Information", "External References", "Implementation Details"];

/* Which sub-views exist for a run, and what each one shows. `own` marks the
   text the agent actually received -- the default, and the only view the
   verified hash speaks for. */
function promptViews(run){
  const key = (DATA.keys || {})[run.instance_id] || {};
  const mi = run.dataset === "missing-info";
  const ownAmb = mi ? key.amb_mi : key.amb_swe;
  /* One text view, not three: it already shows the ambiguous rewrite and the
     full issue together, so separate "ambiguous" and "full" chips were two
     halves of the thing the reader is here to compare. */
  const views = [
    { id: "removed", label: "both conditions", derived: true, own: true,
      why: (ownAmb && key.issue_full) ? "" : "needs both condition texts" },
  ];
  if (mi){
    views.push(
      { id: "withheld", label: "questions vs dataset", cat: (key.hidden || []).length,
        why: (key.hidden || []).length ? "" : "no hidden_info for this instance" },
      { id: "baselines", label: "baseline questions",
        cat: Object.values(key.baselines || {}).filter(Boolean).length,
        why: Object.values(key.baselines || {}).some(Boolean) ? "" : "no baseline questions" },
    );
  } else {
    // The other dataset's independent rewrite of the same issue. Verified to
    // differ from this dataset's ambiguous text on all 500 instances, so it
    // separates "hard instance" from "hard rewrite".
    views.push({ id: "mi", label: "other dataset's rewrite", text: key.amb_mi,
      why: key.amb_mi ? "" : "not rewritten in the missing-info workbook" });
  }
  return views;
}

function panelPrompt(run){
  const p = run.prompt;
  if (p.source !== "rebuilt")
    return `<div class="unverified">Prompt could not be rebuilt${p.error ? ": " + esc(p.error) : ""}.
      Logs store only the hash <code>${esc(p.expected_sha256 || "")}</code>.</div>`;

  const views = promptViews(run);
  const own = views.find(v => v.own) || views[0];
  if (!views.some(v => v.id === state.promptView && !v.why)) state.promptView = own.id;
  const active = views.find(v => v.id === state.promptView) || own;

  /* The hash certifies the one text this run was sent. The default view shows
     that text (beside its counterpart), so it carries the full badge; the
     answer-key views are not prompts at all and say so rather than implying
     the checkmark covers them. */
  const showingOwn = active.id === own.id;
  /* One line. The full provenance sentence is a tooltip: it is reassurance you
     read once, not a banner that costs vertical space on every view. */
  const badge = p.verified
    ? `<div class="verified${showingOwn ? "" : " dim"}" title="${esc(
        `Prompts are not stored in the logs — only task.prompt_sha256. This text was rebuilt with `
        + `experiment.build_prompt(row, "${p.condition}") and its SHA-256 matches the hash recorded `
        + `at launch, so it is byte-identical to what the agent received.`
        + (showingOwn ? "" : " You are currently viewing evaluator data, which the hash does not cover."))}">
        <b>✓ ${showingOwn ? `verified prompt` : `prompt verified`}</b>
        <span>${showingOwn
          ? `this is exactly the <b>${esc(p.condition)}</b> text the agent received`
          : `— this view is evaluator data, not the prompt`}</span>
        <code>${esc((p.sha256 || "").slice(0, 12))}…</code></div>`
    : `<div class="unverified" title="The dataset no longer reproduces the prompt recorded for this run; the text shown may not be what the agent received.">
        <b>✗ hash mismatch</b><span>the stored prompt hash does not match — do not trust this text</span></div>`;

  const chips = views.map(v => {
    const n = v.derived ? "" : (v.cat !== undefined ? v.cat : (v.text || "").length.toLocaleString());
    return `<button class="chip" data-pv="${v.id}" aria-pressed="${v.id === active.id}"
      ${v.why ? `disabled title="${esc(v.why)}"` : ""}>${esc(v.label)}${
      n !== "" ? `<span class="c">${n}</span>` : ""}</button>`;
  }).join("");

  return badge + `<div class="tlbar">${chips}</div>` +
    `<div id="prompttext">${promptBody(run, active)}</div>`;
}

function promptBody(run, view){
  const key = (DATA.keys || {})[run.instance_id] || {};
  if (view.id === "removed") return viewRemoved(run, key);
  if (view.id === "mi") return `<p class="hint">The <b>missing-info</b> workbook's independent
    rewrite of this same issue (its <code>rewrite_3</code>). This run did not see this text — it is
    shown so you can compare how two different papers made the same issue ambiguous. Verified to
    differ from this dataset's ambiguous rewrite on all 500 instances, which separates "this
    instance is hard" from "this rewrite is hard".</p>
    <div class="prompt">${esc(view.text || "")}</div>`;
  if (view.id === "withheld") return viewWithheld(run, key);
  if (view.id === "baselines") return viewBaselines(run, key);
  return `<div class="prompt">${esc(view.text || "")}</div>`;
}

/* The full issue beside the ambiguous rewrite.
   Deliberately NOT a word diff: measured across these instances, an ambiguous
   text shares only 7-28% of its words with the full issue, because it is an
   independently written rewrite rather than a redaction. Word-level LCS on two
   such texts interleaves them into noise that reads as if every other word was
   edited. Side by side is honest about what the manipulation actually is. */
function viewRemoved(run, key){
  const amb = run.dataset === "missing-info" ? key.amb_mi : key.amb_swe;
  if (!amb || !key.issue_full) return `<p class="hint">Needs both condition texts.</p>`;
  const spans = (key.hidden || []).flatMap(s => s.examples.map(e => ({ cat: s.category, text: e })));
  /* Highlight the spans the answer key says were removed, where they can still
     be located in the full text -- about two thirds of them survive the Excel
     round-trip well enough to match. */
  let left = esc(key.issue_full), found = 0;
  for (const s of spans){
    const needle = esc(s.text.trim());
    if (needle.length > 30 && left.includes(needle)){
      left = left.replace(needle, `<mark title="${esc(s.cat)} — removed">${needle}</mark>`);
      found++;
    }
  }
  /* Say what the reader is actually looking at. Across these instances only
     45% of recorded spans can be located verbatim, so "nothing is
     highlighted" is a normal outcome and must not read as missing data. */
  const note = !spans.length
    ? `No answer key records removed spans for this instance, so nothing is marked.`
    : found
      ? `<mark>Highlighted</mark> passages on the left are text the answer key records as removed
         (${found} of ${spans.length} recorded spans matched the issue text exactly).`
      : `None of the ${spans.length} recorded spans matched the issue text exactly, so nothing is
         highlighted here — the answer key stores them as paraphrases rather than quotes. Use the
         <b>questions vs dataset</b> view to inspect the workbook value.`;
  return `<p class="hint">The full issue (left) beside the ambiguous rewrite the agent received
    (right). ${note}
    The rewrite is not a redaction of the left text; it was written independently, so read it as
    a different telling of the same issue rather than the left text minus some words.</p>
    <div class="side">
      <div><div class="flabel2">full issue · ${key.issue_full.length.toLocaleString()} chars</div>
        <div class="prompt">${left}</div></div>
      <div><div class="flabel2">ambiguous · ${amb.length.toLocaleString()} chars</div>
        <div class="prompt">${esc(amb)}</div></div>
    </div>`;
}

function catChip(name, state, mark){
  return `<span class="catchip ${state}" title="${esc(name)} — ${state}">${esc(name)}${
    mark ? ` <b title="category name recovered from its probe question">+</b>` : ""}</span>`;
}

/* The ledger: all six categories always, so "2 hidden" is legible against how
   many were even there to hide. Carries its own legend, because three chip
   states with no key is the kind of thing a reader silently guesses wrong. */
function viewLedger(key, note, label){
  const hidden = new Set(key.hidden_cats || []);
  const present = new Set(key.present || []);
  if (!present.size && !hidden.size) return "";
  const chips = CATEGORIES.map(c => catChip(
    c,
    hidden.has(c) ? "hidden" : (present.has(c) ? "present" : "absent"),
    hidden.has(c) && key.repaired && c === "Implementation Details",
  )).join("");
  const legend = `<span class="legend">
    <span title="in the original issue, then removed from the rewrite the agent saw — the agent should ask about these"><i class="sw hidden"></i>hidden</span>
    <span title="in the original issue and kept in the rewrite — the agent already has this"><i class="sw present"></i>still shown</span>
    <span title="this issue never contained this category, so there was nothing to hide or ask for"><i class="sw absent"></i>not in issue</span>
  </span>`;
  return `<div class="ledger">${label ? `<span class="ledlab">${esc(label)}</span>` : ""}${chips}${legend}</div>${note || ""}`;
}

/* The recorded questions beside the parsed hidden_info_3 dataset value.
   Deliberately no automatic matching: the two evidence sources are shown for
   a reader to compare directly. The ledger is already above the chip bar. */
function viewWithheld(run, key){
  const hidden = key.hidden || [];
  const asked = `<div class="card ask">
      <h4>Agent questions and recorded answers</h4>
      ${(run.ask.questions || []).map(r => Object.entries(r.answers || {}).map(([q, a]) =>
        `<div class="qq">${esc(q)}</div>
         <div class="answer">recorded answer: ${esc(a)}</div>`).join("")).join("")}
    </div>`;

  const cards = hidden.map(seg => `<div class="card">
      <h4>${esc(seg.category)}</h4>
      <div class="flabel2">category probe stored in hidden_info_3</div>
      <div class="qq">${esc(seg.probe)}</div>
      <div class="flabel2">examples stored in hidden_info_3 (${seg.examples.length})</div>
      ${seg.examples.map(e => `<pre class="code">${esc(e)}</pre>`).join("")}
    </div>`).join("");

  const dataset = `<div class="card">
      <h4>Dataset value · hidden_info_3 (${hidden.length}
        ${hidden.length === 1 ? "category" : "categories"})</h4>
      <p class="hint">The cards below directly display the category, probe, and examples parsed
        from this instance's workbook value. No automatic comparison or score is applied.</p>
    </div>` +
    cards +
    (key.repaired
      ? `<p class="hint">One category above was recovered from its probe question — the workbook
         lost that label upstream, so reading <code>hidden_categories_3</code> alone would
         undercount it.</p>` : "");

  return run.ask.direct_asked
    ? `<div class="qa-compare"><div>${asked}</div><div>${dataset}</div></div>`
    : dataset;
}

function viewBaselines(run, key){
  const b = key.baselines || {};
  const names = { gpt5: "GPT-5", grpo: "GRPO" };
  const cards = Object.entries(b).filter(([, v]) => v).map(([k, v]) =>
    `<div class="card"><h4>${esc(names[k] || k)}</h4>
      <div class="prompt" style="border:0;padding:0;background:none">${esc(v)}</div></div>`).join("");
  return `<p class="hint">Clarification questions published with the workbook for this instance,
    to read beside this run's own question. They were generated against the same
    <code>rewrite_3</code> text.</p>${cards || `<p class="hint">No baselines for this instance.</p>`}`;
}
function panelPatch(run){
  const e = run.eval;
  const files = run.patch.files;
  const diff = run.patch.text
    ? run.patch.text.split("\n").slice(0, 4000).map(l => {
        const c = l.startsWith("+++") || l.startsWith("---") ? "h"
          : l.startsWith("diff --git") ? "f"
          : l.startsWith("+") ? "a" : l.startsWith("-") ? "d"
          : l.startsWith("@@") ? "h" : "";
        return `<div class="${c}">${esc(l) || "&nbsp;"}</div>`;
      }).join("")
    : `<div class="h">no patch produced</div>`;
  const tests = e.tests;
  const testBlock = (label, t) => t ? `
    <div class="kv"><span class="k">${label}</span>
      <span class="v ${t.failed ? "minus" : "plus"}">${t.passed} passed · ${t.failed} failed</span></div>
    ${t.failures.length ? `<div class="tests">${t.failures.map(n => `<div class="fail">✗ ${esc(n)}</div>`).join("")}</div>` : ""}` : "";
  return `<div class="two">
    <div><div class="diff">${diff}</div></div>
    <div>
      <div class="card">
        <h4>verdict</h4>
        <div class="verdict ${e.status !== "scored" ? "un" : e.resolved ? "ok" : "no"}">
          ${e.status !== "scored" ? "not scored" : e.resolved ? "✓ resolved" : "✗ unresolved"}</div>
        <div class="kv"><span class="k">FAIL_TO_PASS</span><span class="v">${e.f2p_passed}/${e.f2p_total}</span></div>
        <div class="kv"><span class="k">PASS_TO_PASS</span><span class="v">${e.p2p_passed}/${e.p2p_total}</span></div>
        <div class="kv"><span class="k">patch size</span><span class="v">${run.patch.bytes.toLocaleString()} B</span></div>
        ${e.error ? `<div class="kv"><span class="k">note</span><span class="v">${esc(e.error)}</span></div>` : ""}
      </div>
      <div class="card">
        <h4>localization</h4>
        <div class="kv"><span class="k">hit</span><span class="v ${e.localization_hit ? "plus" : "minus"}">${e.localization_hit ? "yes" : "no"}</span></div>
        <div class="flabel2">gold files</div>
        ${(e.gold_files || []).map(f => `<div class="filerow"><span class="p">${esc(f)}</span></div>`).join("") || `<div class="hint">none recorded</div>`}
        <div class="flabel2">agent source files</div>
        ${(e.agent_source_files || []).map(f => `<div class="filerow"><span class="p">${esc(f)}</span>${
          (e.gold_files || []).includes(f) ? `<span class="tag gold">gold</span>` : ""}</div>`).join("") || `<div class="hint">none</div>`}
        <p class="hint" style="margin-top:7px">A hit means <i>any</i> overlap with the gold set, not an exact match.</p>
      </div>
      <div class="card">
        <h4>files changed (${files.length})</h4>
        ${files.map(f => `<div class="filerow">
          <span class="p" title="${esc(f.path)}">${esc(f.path)}</span>
          ${f.in_gold ? `<span class="tag gold">gold</span>` : ""}
          ${f.is_test ? `<span class="tag test">test</span>` : ""}
          <span class="plus">+${f.added}</span><span class="minus">−${f.removed}</span>
        </div>`).join("") || `<div class="hint">none</div>`}
      </div>
      ${tests ? `<div class="card"><h4>harness tests</h4>
        ${testBlock("FAIL_TO_PASS", tests.f2p)}${testBlock("PASS_TO_PASS", tests.p2p)}
        <p class="hint" style="margin-top:6px">Failures listed in full; passing names sampled.</p></div>` : ""}
      <div class="card"><h4>artifacts</h4>
        ${Object.entries(run.artifacts).map(([k, v]) =>
          `<div class="kv"><span class="k">${esc(k)}</span><span class="v" title="${esc(v.path)}">${v.exists ? "✓" : "—"}</span></div>`).join("")}
      </div>
    </div></div>`;
}

/* ---------- selection & routing ---------- */
function select(id, opts = {}){
  if (id !== state.selected) state.promptView = null;  // re-default to the sent text
  state.selected = id;
  renderRows(); renderDetail();
  if (!opts.noScroll) scrollToSelected();
  const run = byId.get(id);
  history.replaceState(null, "", run ? `#run=${run.short_id}&panel=${state.panel}` : "#");
}
function scrollToSelected(){
  const idx = rowsCache.findIndex(r => r.run_id === state.selected);
  if (idx < 0) return;
  const box = $("#rows"), H = 30, top = idx * H;
  if (top < box.scrollTop || top + H > box.scrollTop + box.clientHeight)
    box.scrollTop = top - box.clientHeight / 2 + H;
  renderRows();
}
function move(delta){
  if (!rowsCache.length) return;
  const idx = rowsCache.findIndex(r => r.run_id === state.selected);
  const next = idx < 0 ? 0 : Math.min(rowsCache.length - 1, Math.max(0, idx + delta));
  select(rowsCache[next].run_id);
}
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  const run = h.get("run"), panel = h.get("panel");
  if (panel) state.panel = panel;
  if (run){
    const hit = RUNS.find(r => r.run_id === run || r.short_id === run);
    /* A deep link must win over a filter that would hide its target. */
    if (hit){
      if (!matches(hit, null)) FACETS.forEach(f => state.filters[f].clear());
      state.selected = hit.run_id;
    }
  }
}

/* ---------- render ---------- */
function renderAll(){
  renderOverview(); renderFilters(); renderHead(); renderRows(); renderDetail();
  const asked = RUNS.filter(r => r.ask.direct_asked === true);
  const pill = $("#askpill");
  if (asked.length){
    pill.hidden = false;
    pill.textContent = `⚠ ${asked.length} run${asked.length > 1 ? "s" : ""} asked a clarifying question →`;
  }
  const c = META.counts;
  $("#hsub").innerHTML = `${c.runs} runs · ${c.instances} instances · ${c.events} events · ${c.pairs} pairs
    · built ${esc((META.generated_at || "").slice(0, 16).replace("T", " "))}
    ${META.git_commit ? `· <code>${esc(META.git_commit)}</code>` : ""}`;
  renderWarnbar();
}

/* The warning is dismissed against a fingerprint of its own content, not a
   bare "hidden" flag: a new or changed warning has a different fingerprint, so
   it reappears on the next load while the dismissal of an unchanged one
   sticks. That is what makes "closed" mean "I read this one" rather than
   "never warn me again". */
function warnFingerprint(list){
  return list.map(w => `${w.text}|${(w.instances || []).join(",")}`).join("~");
}
function renderWarnbar(){
  const bar = $("#warnbar");
  const list = META.build_warnings || [];
  if (!list.length){ bar.hidden = true; return; }
  let dismissed = null;
  try { dismissed = localStorage.getItem("ambig-warnbar-dismissed"); } catch {}
  if (dismissed === warnFingerprint(list)){ bar.hidden = true; return; }

  const items = list.slice(0, 12).map(w => {
    // Runs are grouped per instance so the reader sees "this instance, in
    // these conditions/models" rather than a flat list repeating each id.
    const byInstance = new Map();
    (w.runs || []).forEach(r => {
      if (!byInstance.has(r.instance_id)) byInstance.set(r.instance_id, []);
      byInstance.get(r.instance_id).push(r);
    });
    const where = (w.instances || []).map(id => {
      const runs = byInstance.get(id) || [];
      const links = runs.map(r =>
        `<button class="warnbar-loc" data-warn-run="${esc(r.short_id)}"
           title="open run ${esc(r.short_id)}">${esc(r.condition)} · ${esc(r.model)}</button>`
      ).join(" ");
      return `<li><code>${esc(id)}</code>${runs.length ? ` — ${links}` : ""}</li>`;
    }).join("");
    return `<li>${esc(w.text)}${where ? `<ul class="warnbar-where">${where}</ul>` : ""}</li>`;
  }).join("");

  bar.hidden = false;
  bar.innerHTML = `<button class="warnbar-x" id="warnbar-x" title="Dismiss until this warning changes"
      aria-label="Dismiss build warnings">×</button>
    <b>${list.length} build warning(s)</b><ul>${items}</ul>`;
}

/* ---------- events ---------- */
$("#warnbar").addEventListener("click", e => {
  if (e.target.closest("#warnbar-x")){
    try {
      localStorage.setItem("ambig-warnbar-dismissed", warnFingerprint(META.build_warnings || []));
    } catch {}
    $("#warnbar").hidden = true;
    return;
  }
  const loc = e.target.closest("[data-warn-run]");
  if (loc){
    const run = RUNS.find(r => r.short_id === loc.dataset.warnRun);
    if (run) select(run.run_id);
  }
});

$("#filters").addEventListener("click", e => {
  if (e.target.closest("#btn-reset")){
    FACETS.forEach(f => state.filters[f].clear());
    state.models = {}; state.openFamily = null;
    state.search = ""; state.sort = "asked"; state.dir = -1;
    history.replaceState(null, "", "#");
    renderAll();
    return;
  }
  const caret = e.target.closest("[data-fam-open]");
  if (caret){
    state.openFamily = state.openFamily === caret.dataset.famOpen ? null : caret.dataset.famOpen;
    renderFilters();
    return;
  }
  const row = e.target.closest(".mrow");
  if (row){
    const fam = row.dataset.fam, model = row.dataset.model;
    const pinned = state.models[fam] || new Set();
    if (!model) pinned.clear();                                   // "all models"
    else pinned.has(model) ? pinned.delete(model) : pinned.add(model);
    state.models[fam] = pinned;
    // Narrowing to a model implies wanting that family in view.
    if (pinned.size) state.filters.family.add(fam);
    renderAll();
    return;
  }
  const chip = e.target.closest(".chip[data-facet]");
  if (!chip) return;
  const set = state.filters[chip.dataset.facet];
  if (set.has(chip.dataset.val)){
    set.delete(chip.dataset.val);
    // Deselecting a family drops its model pins too, so a hidden pin cannot
    // silently filter the next time that family is switched back on.
    if (chip.dataset.facet === "family") delete state.models[chip.dataset.val];
  } else set.add(chip.dataset.val);
  renderAll();
});
/* Any click outside an open family menu closes it. The coverage switcher uses
   the same state under a "cov:" prefix, so re-render whichever owns it. */
document.addEventListener("click", e => {
  if (!state.openFamily || e.target.closest(".famwrap")) return;
  const wasCoverage = state.openFamily.startsWith("cov:");
  state.openFamily = null;
  wasCoverage ? renderDetail() : renderFilters();
});
$("#thead").addEventListener("click", e => {
  const b = e.target.closest("[data-sort]"); if (!b) return;
  if (state.sort === b.dataset.sort) state.dir = -state.dir;
  else { state.sort = b.dataset.sort; state.dir = -1; }
  renderHead(); renderRows();
});
$("#rows").addEventListener("click", e => {
  const pair = e.target.closest("[data-pair]");
  if (pair){ e.stopPropagation(); select(pair.dataset.pair); return; }
  const row = e.target.closest(".trow");
  /* Clicking the open run again, or the empty space under the list, closes it
     and returns to the coverage overview -- so getting back is the same
     gesture that got you in, with no dedicated "back" affordance to find. */
  if (!row){ if (state.selected) select(null); return; }
  select(row.dataset.id === state.selected ? null : row.dataset.id, { noScroll: true });
});
$("#rows").addEventListener("scroll", () => {
  if (window.__rf) return;
  window.__rf = requestAnimationFrame(() => { window.__rf = 0; renderRows(); });
});
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-panel]"); if (!t) return;
  state.panel = t.dataset.panel; renderDetail();
});
$("#panel").addEventListener("click", e => {
  const covOpen = e.target.closest("[data-cov-open]");
  if (covOpen){
    const k = "cov:" + covOpen.dataset.covOpen;
    state.openFamily = state.openFamily === k ? null : k;
    renderDetail();
    return;
  }
  const covPick = e.target.closest("[data-cov-pick]");
  if (covPick){
    state.coverageFamily[covPick.dataset.covPick] = covPick.dataset.model;
    state.openFamily = null;
    renderDetail();
    return;
  }
  const cov = e.target.closest("[data-go]");
  if (cov){ select(cov.dataset.go); return; }
  const row = e.target.closest(".ev-row");
  if (row){
    const body = $(`[data-body="${row.dataset.ev}"]`);
    if (body.hidden){ body.innerHTML = eventBody(byId.get(state.selected), +row.dataset.ev); body.hidden = false; }
    else body.hidden = true;
    return;
  }
  const tl = e.target.closest("[data-tl]");
  if (tl){
    const k = tl.dataset.tl;
    $("#panel").querySelectorAll("[data-tl]").forEach(b => b.setAttribute("aria-pressed", b === tl));
    let shown = 0;
    $("#panel").querySelectorAll(".ev-row").forEach(r => {
      const show = k === "all" || r.dataset.k === k;
      r.hidden = !show;
      if (show) shown++;
      const body = $(`[data-body="${r.dataset.ev}"]`);
      if (body && !show) body.hidden = true;
    });
    /* The "first ask" / "first edit" markers only mean something next to the
       event they point at, so they travel with it. */
    $("#panel").querySelectorAll(".divider").forEach(d => {
      d.hidden = !(k === "all" || d.dataset.for === k);
    });
    const note = $("#tlempty");
    if (note) note.hidden = shown > 0;
    return;
  }
  const pv = e.target.closest("[data-pv]");
  if (pv && !pv.disabled){
    state.promptView = pv.dataset.pv;
    renderDetail();
    return;
  }
});
$("#askpill").addEventListener("click", () => {
  const asked = RUNS.filter(r => r.ask.direct_asked === true);
  if (!asked.length) return;
  const idx = asked.findIndex(r => r.run_id === state.selected);
  select(asked[(idx + 1) % asked.length].run_id);
});
$("#btn-theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("ambig-theme", next); } catch {}
});
/* Hiding the summary hands its space to the run list. The virtualised table
   sizes its window from clientHeight, so it has to re-render at the new
   height or it would keep drawing only the old viewport's worth of rows. */
function toggleOverview(on){
  state.overview = on === undefined ? !state.overview : on;
  const btn = $("#btn-overview");
  btn.setAttribute("aria-pressed", String(state.overview));
  btn.textContent = (state.overview ? "▾" : "▸") + " summary";
  renderOverview();
  renderRows();
  try { localStorage.setItem("ambig-overview", state.overview ? "1" : "0"); } catch {}
}
$("#btn-overview").addEventListener("click", () => toggleOverview());
/* split pane */
(() => {
  let dragging = false;
  $("#drag").addEventListener("mousedown", () => { dragging = true; document.body.style.userSelect = "none"; });
  addEventListener("mouseup", () => { dragging = false; document.body.style.userSelect = ""; });
  addEventListener("mousemove", e => {
    if (!dragging) return;
    /* Keep the bounds in step with #list's min/max-width, or the pane would
       stop moving while the divider kept following the cursor. */
    const w = Math.min(Math.max(e.clientX, 300), innerWidth * 0.72);
    $("#list").style.width = w + "px";
    renderRows();
  });
})();

/* ---------- boot ---------- */
try {
  const t = localStorage.getItem("ambig-theme");
  if (t) document.documentElement.dataset.theme = t;
  if (localStorage.getItem("ambig-overview") === "0") state.overview = false;
} catch {}
readHash();
renderAll();
toggleOverview(state.overview);   // sync the button label with restored state
if (!state.selected && rowsCache.length) { /* leave unselected: the table is the entry point */ }
else if (state.selected) scrollToSelected();
addEventListener("resize", renderRows);
</script>
</body>
</html>
